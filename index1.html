<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Core | Zero-Sum Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index1.css">
</head>
<body>
    <div class="scanlines"></div>
    
    <div class="game-wrapper">
        <div class="terminal-header">
            <div class="system-monitor">
                <div class="monitor-bar">
                    <div class="bar-fill"></div>
                </div>
                <div class="binary-stream" id="binary-stream">010110</div>
            </div>
        </div>

        <div class="ui-panel">
            <div class="stats">
                <div class="stat-box">PLAYER: <span id="p-score">X</span></div>
                <div class="stat-box">STATUS: <span id="status">WAITING</span></div>
            </div>

            <div class="game-grid" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <button id="reboot-btn">REFRESH</button>
        </div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h1 id="result-text">SIGNAL LOST</h1>
            <p>Game Ended</p>
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script src="index1.js"></script>
</body>
</html>
